[project]
name = "spatial-econometrics-poland-migration"
version = "1.0.0"
description = "Ekonometria przestrzenna migracji wewnętrznych w gminach Polski: przygotowanie danych i testy MNK"
authors = [{ name = "Celina Brzywczy" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "stargazer>=0.0.7",
    "statsmodels>=0.14",
]

[tool.uv]
package = false
